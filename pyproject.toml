[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ato-ai-mem"
dynamic = ["version"]
description = "Deterministic read-only analysis tools for ato-ai-skill-mem vaults"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ato-mem = "ato_ai_mem.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {file = ["VERSION"]}
