name: Tests

on:
  push:
  pull_request:

jobs:
  contracts:
    name: Skill contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check single installation contract
        run: python -m unittest discover -s tests -p 'test_*.py'

  bash:
    name: Bash (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Run wiki tests
        shell: bash
        run: ./tests/test-wiki.sh
      - name: Check installed skill wiki
        shell: bash
        run: ./scripts/wiki.sh check
      - name: Verify shell syntax
        shell: bash
        run: sh -n scripts/wiki.sh scripts/release-check.sh tests/test-wiki.sh

  powershell:
    name: PowerShell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Run wiki tests
        shell: pwsh
        run: ./tests/test-wiki.ps1
      - name: Check installed skill wiki
        shell: pwsh
        run: ./scripts/wiki.ps1 check
      - name: Verify worktree is clean
        shell: pwsh
        run: git diff --exit-code
